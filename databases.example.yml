# apiBLAST Database Configuration
#
# List every MMseqs2 database this server should expose to users.
# Copy this file to databases.yml and edit it for your installation.
#
# Only MMseqs2 sequence databases are supported. BLAST databases (makeblastdb
# output: .nsq/.psq/.nal/... files) and MMseqs2 profile databases cannot be
# searched.
#
# name     - Database identifier used in job submissions, and the base name of
#            its MMseqs2 files.
#
# path     - Directory containing the MMseqs2 database files.
#            The target passed to mmseqs is <path>/<name>, so the files inside
#            this directory must share the base name of the `name` field
#            (e.g. name: silva → files silva, silva.dbtype, silva.index,
#            silva_h, silva.idx …).
#
# type     - "nucleotide" : nucleotide database, accepted by blastn.
#                           Indexed with createindex --search-type 3.
#            "protein"    : protein database, accepted by blastp and blastx.
#                           Padded with makepaddedseqdb for GPU searches.
#
# description - Free-text label shown in GET /api/v1/databases responses.
#
# DB_CONFIG env var points to this file (default: databases.yml in CWD).
#
# The entries below are MMseqs2's standard databases (`mmseqs databases`).

databases:
  - name: silva
    path: /data/db/silva
    type: nucleotide
    description: "SILVA ribosomal RNA (mmseqs databases SILVA)"

  - name: resfinder
    path: /data/db/resfinder
    type: nucleotide
    description: "ResFinder antimicrobial resistance genes (mmseqs databases Resfinder)"

  - name: nt
    path: /data/db/nt
    type: nucleotide
    description: "NCBI nucleotide collection (mmseqs databases NT)"

  - name: swissprot
    path: /data/db/swissprot
    type: protein
    description: "UniProtKB/Swiss-Prot (mmseqs databases UniProtKB/Swiss-Prot)"

  - name: uniref90
    path: /data/db/uniref90
    type: protein
    description: "UniRef90 (mmseqs databases UniRef90)"
