{{- $reserved := list "REDIS_URL" "RESULT_DIR" "DB_CONFIG" "CELERY_CONCURRENCY" "MMSEQS_GPU_ENABLED" -}}
{{- range $k, $_ := .Values.config }}
{{- if has $k $reserved }}
{{- fail (printf "config.%s is set by the chart and must not be overridden in values.config" $k) }}
{{- end }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: apiblast-config
  namespace: {{ .Values.namespace }}
data:
  # ── Set by the chart ────────────────────────────────────────────────────────
  REDIS_URL: "redis://apiblast-redis:6379/0"
  RESULT_DIR: "/data/results"
  DB_CONFIG: "/etc/apiblast/databases.yml"
  CELERY_CONCURRENCY: {{ .Values.celery.concurrency | toString | quote }}
  # Route to blast_gpu only while the GPU worker exists
  MMSEQS_GPU_ENABLED: {{ .Values.gpuWorker.enabled | toString | quote }}
  # ── values.config ───────────────────────────────────────────────────────────
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  # ── Mounted at /etc/apiblast/databases.yml ─────────────────────────────────
  databases.yml: |
    # Rendered from values.databases by the apiblast Helm chart.
    {{- $dbs := list }}
    {{- range .Values.databases }}
    {{- $name := required "databases[].name is required" .name }}
    {{- $type := required (printf "databases[%s].type is required (nucleotide|protein)" $name) .type }}
    {{- if not (has $type (list "nucleotide" "protein")) }}
    {{- fail (printf "databases[%s].type must be nucleotide or protein, got %q" $name $type) }}
    {{- end }}
    {{- $entry := merge (deepCopy .) (dict "path" (printf "/data/db/%s" $name) "description" "") }}
    {{- $dbs = append $dbs $entry }}
    {{- end }}
    {{- toYaml (dict "databases" $dbs) | nindent 4 }}
