{{- $r := .Values.redis }}
{{- $sc := .Values.defaultSecurityContext }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiblast-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: apiblast-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apiblast-redis
  template:
    metadata:
      name: apiblast-redis
      labels:
        app: apiblast-redis
    spec:
      {{- include "apiblast.securityContext" $sc | nindent 6 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      volumes:
        {{- include "apiblast.volumes" . | nindent 8 }}
      {{- if .Values.volumes.initDirs.enabled }}
      initContainers:
        {{- include "apiblast.initDirsContainer" (dict "root" $ "subPaths" (list .Values.volumes.sharedTeam.subPaths.redis) "owner" (printf "%v:%v" $sc.runAsUser $sc.runAsGroup)) | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ printf "%s:%s" $r.image.repository ($r.image.tag | toString) | quote }}
          imagePullPolicy: {{ $r.image.pullPolicy }}
          {{- include "apiblast.resources" $r.resources | nindent 10 }}
          command:
            - redis-server
            - --save
            - "60 1"
            - --dir
            - /data
            - --loglevel
            - warning
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: shared-team
              mountPath: /data
              subPath: {{ .Values.volumes.sharedTeam.subPaths.redis }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apiblast-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: apiblast-redis
spec:
  type: ClusterIP
  selector:
    app: apiblast-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
