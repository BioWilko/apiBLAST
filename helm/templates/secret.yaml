apiVersion: v1
kind: Secret
metadata:
  name: apiblast-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "credentials.secretKey is required (see values-secrets.yaml.example)" .Values.credentials.secretKey | quote }}
  POSTGRES_PASSWORD: {{ required "credentials.postgresPassword is required (see values-secrets.yaml.example)" .Values.credentials.postgresPassword | quote }}
  DATABASE_URL: {{ required "credentials.databaseUrl is required (see values-secrets.yaml.example)" .Values.credentials.databaseUrl | quote }}
