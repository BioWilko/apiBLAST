{{- $pg := .Values.postgres }}
{{- $sc := $pg.securityContext | default .Values.defaultSecurityContext }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apiblast-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: apiblast-postgres
spec:
  serviceName: apiblast-postgres
  replicas: 1
  selector:
    matchLabels:
      app: apiblast-postgres
  template:
    metadata:
      name: apiblast-postgres
      labels:
        app: apiblast-postgres
    spec:
      {{- include "apiblast.securityContext" $sc | nindent 6 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      volumes:
        {{- include "apiblast.volumes" . | nindent 8 }}
        # Socket/lock dir; the image's copy is only writable by its postgres user
        - name: run-postgresql
          emptyDir: {}
      {{- if .Values.volumes.initDirs.enabled }}
      initContainers:
        {{- include "apiblast.initDirsContainer" (dict "root" $ "subPaths" (list .Values.volumes.sharedTeam.subPaths.postgres) "owner" (printf "%v:%v" $sc.runAsUser $sc.runAsGroup)) | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ printf "%s:%s" $pg.image.repository ($pg.image.tag | toString) | quote }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          {{- include "apiblast.resources" $pg.resources | nindent 10 }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            # Only applied by initdb on an empty data dir
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apiblast-credentials
                  key: POSTGRES_PASSWORD
            # initdb needs an empty directory it owns, which the mount point may not be
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: shared-team
              mountPath: /var/lib/postgresql/data
              subPath: {{ .Values.volumes.sharedTeam.subPaths.postgres }}
            - name: run-postgresql
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ $pg.user | quote }}
                - -d
                - {{ $pg.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apiblast-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: apiblast-postgres
spec:
  type: ClusterIP
  selector:
    app: apiblast-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
